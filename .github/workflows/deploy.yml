name: Build and Deploy

on:
  workflow_run:
    workflows: ["test"]
    types:
      - completed
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      packages: write
      id-token: write

    outputs:
      image-ref: ${{ steps.push.outputs.digest }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase image name
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          push: true
          tags: ${{ env.IMAGE }}:latest

      - name: install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign the image
        run: |
          cosign sign --yes \
          ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}

      - name: save image ref
        run: echo "image-ref=${{ env.IMAGE }}@${{ steps.push.outputs.digest }}" > image-ref.txt

      - name: Upload image ref
        uses: actions/upload-artifact@v4
        with:
          name: image-ref-backed
          path: image-ref.txt

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download image ref
        uses: actions/download-artifact@v4
        with:
          name: image-ref-backed
          path: refs

      - name: Resolve image ref
        run: |
          echo "BACKEND_IMAGE=$(cat refs/image-ref.txt)" >> $GITHUB_ENV

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Render .env from secrets
        run: |
          umask 077
          cat > deploy.env <<EOF
          BACKEND_IMAGE=${BACKEND_IMAGE}
          POSTGRES_USER=${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB=${{ secrets.POSTGRES_DB }}
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          SECRET_KEY=${{ secrets.SECRET_KEY }}
          CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}
          ALLOWED_ORIGINS=${{ secrets.ALLOWED_ORIGINS }}
          FRONTEND_URL=${{ secrets.FRONTEND_URL }}
          MAIL_SERVER=${{ secrets.MAIL_SERVER }}
          MAIL_PORT=${{ secrets.MAIL_PORT }}
          MAIL_USERNAME=${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}
          MAIL_FROM=${{ secrets.MAIL_FROM }}
          EOF

      - name: Copy files to VPS
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
        run: |
          SSH="ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes ${USER}@${HOST}"
          SCP="scp -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes"
          $SSH 'mkdir -p ~/blog'
          $SCP deploy.env "${USER}@${HOST}:~/blog/.env"
          $SCP deploy/docker-compose.prod.yml "${USER}@${HOST}:~/blog/docker-compose.yml"

      - name: Verify signature and deploy
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes "${USER}@${HOST}" \
            BACKEND_IMAGE="${BACKEND_IMAGE}" \
            GHCR_USER="${GHCR_USER}" GHCR_TOKEN="${GHCR_TOKEN}" REPO="${REPO}" \
            'bash -s' <<'REMOTE'
          set -euo pipefail
          cd ~/blog

          echo "==> Logging in to GHCR"
          echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin

          echo "==> Verifying image signature"
          IDENTITY_RE="^https://github.com/${REPO}/.github/workflows/deploy.yml@refs/heads/main"
          ISSUER="https://token.actions.githubusercontent.com"
          cosign verify \
            --certificate-identity-regexp "${IDENTITY_RE}" \
            --certificate-oidc-issuer "${ISSUER}" \
            "${BACKEND_IMAGE}" > /dev/null
          echo "✓ Image verified"

          echo "==> Pulling and starting stack"
          docker compose --env-file .env pull
          docker compose --env-file .env up -d --remove-orphans

          echo "==> Cleaning up"
          docker image prune -f
          docker logout ghcr.io
          REMOTE
